<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mark Hunanyan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="images/favicon.png" />

    <style>
      :root {
        --void: #0d0f10;
        --panel: #15181b;
        --panel-2: #1b1f23;
        --line: #2a3034;
        --text: #edefef;
        --muted: #7a8288;
        --signal: #ff5a1f;
        --blue: #3e8ede;
        --green: #4cc38a;
        --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        --sans:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      html[data-theme='light'] {
        --void: #f3f2ee;
        --panel: #ffffff;
        --panel-2: #eae8e2;
        --line: #d9d6cf;
        --text: #14171a;
        --muted: #63676b;
        --signal: #d9480f;
        --blue: #1f6fb2;
        --green: #1f8f5f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        color: var(--text);
        font-family: var(--sans);
        overflow-x: hidden;
        transition: color 0.3s ease;
      }
      a {
        color: inherit;
      }
      ::selection {
        background: var(--signal);
        color: var(--void);
      }
      :focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 3px;
      }

      /* ---------- NAV ---------- */
      header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        padding: 20px clamp(20px, 4vw, 56px);
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.08em;
        background: linear-gradient(var(--void), transparent);
        pointer-events: none;
      }
      header * {
        pointer-events: auto;
      }
      .nav-wrap {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .menu-toggle {
        display: none;
        background: none;
        border: 1px solid var(--line);
        color: var(--text);
        width: 42px;
        height: 42px;
        border-radius: 8px;
        font-size: 22px;
        cursor: pointer;
      }
      .brand {
        color: var(--text);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-size: 16px;
      }
      .brand span {
        color: var(--signal);
      }
      .brand .blink {
        width: 8px;
        height: 8px;
        background: var(--signal);
        display: inline-block;
        animation: blink 2.2s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      .brand .label {
        color: var(--muted);
        letter-spacing: 0.1em;
        font-weight: 600;
        font-size: 14px;
      }
      nav a {
        margin-left: 24px;
        color: var(--muted);
        text-decoration: none;
        text-transform: uppercase;
      }
      nav a:hover {
        color: var(--text);
      }
      .score-row {
        flex-basis: 100%;
        display: flex;
        justify-content: flex-end;
        margin-top: 10px;
      }

      /* ---------- HERO / VIEWPORT ---------- */
      #flowField {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        display: block;
        background: var(--void);
      }
      .target-hit {
        position: fixed;
        top: 70px;
        right: 64px;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: transparent;
        border: none;
        padding: 0;
        cursor: pointer;
        z-index: 40;
      }
      body {
        padding-top: 260px;
      }

      /* ---------- SECTION LABELS ---------- */
      .section {
        padding: 96px clamp(20px, 4vw, 56px);
      }
      .section-head {
        display: flex;
        justify-content: center;
        align-items: baseline;
        margin-bottom: 44px;
      }
      .section-head h2 {
        font-family: var(--mono);
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text);
      }
      .section-head .count {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }

      /* ---------- CARD GRID ---------- */
      .grid {
        display: grid;
        gap: 28px;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
      .card {
        position: relative;
        display: block;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        transition:
          border-color 0.3s ease,
          transform 0.3s ease,
          background 0.3s ease;
      }
      .card:hover {
        border-color: var(--signal);
        transform: translateY(-4px);
      }

      .card-art {
        position: relative;
        aspect-ratio: 4/3;
        overflow: hidden;
        background: var(--panel-2);
      }
      .card-art img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        filter: saturate(1) contrast(1);
        transition: filter 0.4s ease;
      }
      .card:hover .card-art img {
        filter: hue-rotate(150deg) saturate(1.4) contrast(1.2);
      }

      .card-date {
        position: absolute;
        top: 12px;
        right: 12px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.06em;
        color: var(--text);
        background: rgba(0, 0, 0, 0.45);
        padding: 3px 8px;
        border-radius: 2px;
        z-index: 3;
      }

      .card-art::after {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--void) 1px, transparent 1px),
          linear-gradient(90deg, var(--void) 1px, transparent 1px);
        background-size: 14px 14px;
        opacity: 0;
        transition: opacity 0.35s ease;
        mix-blend-mode: overlay;
      }
      .card:hover .card-art::after {
        opacity: 0.55;
      }

      .card-body {
        padding: 18px 20px 20px;
      }
      .card-title {
        font-family: var(--sans);
        font-weight: 600;
        font-size: 17px;
        margin-bottom: 6px;
      }
      .card-desc {
        font-size: 12.5px;
        color: var(--muted);
        line-height: 1.5;
        margin-bottom: 12px;
      }
      .card-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-family: var(--mono);
        font-size: 10.5px;
      }
      .card-tools span {
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 2px 7px;
        border-radius: 2px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      /* ---------- ABOUT / CONTACT ---------- */
      .about-grid {
        display: flex;
        justify-content: center;
        text-align: center;
      }
      .about-grid p {
        color: var(--muted);
        line-height: 1.75;
        font-size: 15px;
        margin-bottom: 16px;
        max-width: 60ch;
      }

      .contact {
        background: transparent;
        border: none;
        border-radius: 8px;
        padding: 56px clamp(24px, 4vw, 64px);
        text-align: center;
      }
      .contact h2 {
        font-family: var(--mono);
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        margin-bottom: 16px;
      }
      .contact p {
        color: var(--muted);
        margin-bottom: 36px;
      }
      .contact-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
      }
      .contact-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-family: var(--mono);
        font-size: 13px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 14px 24px;
        transition:
          border-color 0.25s ease,
          color 0.25s ease,
          background 0.25s ease,
          transform 0.25s ease;
      }
      .contact-link:hover {
        border-color: var(--signal);
        color: var(--signal);
        background: var(--panel-2);
        transform: translateY(-2px);
      }
      .contact-link .arrow {
        transition: transform 0.25s ease;
      }
      .contact-link:hover .arrow {
        transform: translateX(4px);
      }
      .contact-link.primary {
        background: var(--signal);
        color: var(--void);
        border-color: var(--signal);
        font-weight: 700;
      }
      .contact-link.primary:hover {
        background: #ff7440;
        color: var(--void);
      }

      footer {
        padding: 28px clamp(20px, 4vw, 56px);
        display: flex;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }
      footer a {
        color: var(--muted);
        text-decoration: none;
      }
      footer a:hover {
        color: var(--text);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }

      @media (max-width: 768px) {
        header {
          background: var(--void);
          padding: 16px 20px;
        }
        .brand .label {
          display: none;
        }
        .menu-toggle {
          display: block;
        }
        .nav-wrap {
          display: none;
          width: 100%;
          margin-top: 16px;
        }
        .nav-wrap.open {
          display: block;
        }
        nav {
          display: flex;
          flex-direction: column;
        }
        nav a {
          margin: 0;
          padding: 16px 0;
          border-top: 1px solid var(--line);
        }
        body {
          padding-top: 140px;
        }
        .target-hit {
          top: 20px;
          right: 72px;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="flowField"></canvas>
    <button
      id="targetHit"
      class="target-hit"
      aria-label="Collect thrown particles"
    ></button>

    <header>
      <a class="brand" href="index.html"
        >MARK HUNANYAN <span class="blink"></span
        ><span class="label">TECH ARTIST</span></a

      <div class="nav-wrap" id="mobileNav">
        <nav>
          <a href="#work">Work</a>
          <a href="about.html">About</a>
          <a href="#contact">Contact</a>
          <a href="https://github.com/markulie" target="_blank" rel="noopener"

          >
        </nav>

      <div class="grid" id="cardGrid"></div>

    <section class="section" id="contact">
      <div class="contact">
        <h2>Contact</h2>
        <p>markhuna(at)gmail(dot)com</p>
        <div class="contact-links">
          <a class="contact-link primary" href="mailto:markhuna@gmail.com"
            >Email <span class="arrow">→</span></a
          >
          <a
            class="contact-link"
            href="https://github.com/markulie"
            target="_blank"
            rel="noopener"
            >GitHub <span class="arrow">→</span></a
          >
        </div>
      </div>
    </section>

    <footer>
      <div>© 2010–2026 Mark Hunanyan</div>
      <div>
        <a href="index.html">Home</a>

        <a href="https://github.com/markulie" target="_blank" rel="noopener"
          >GitHub</a
        >
        · <a href="legal-notice.html">Legal Notice</a>
      </div>
    </footer>

    <script>
      const root = document.documentElement

      // ---------- Page appearance ----------
      // Set the color mode this page opens in: 'dark' or 'light'.
      const PAGE_MODE = 'dark'
      // Optional: force a specific background color for this page, e.g. '#101214'.
      // Leave as null to just use PAGE_MODE's default background.
      const PAGE_BG_COLOR = null

      root.setAttribute('data-theme', PAGE_MODE)
      if (PAGE_BG_COLOR) {
        root.style.setProperty('--void', PAGE_BG_COLOR)
      }

      // ---------- Mini-game switch ----------
      // Set to false to fully disable the particle game on this page
      // (no particles, no circle, no scoring — just the plain background).
      const MINIGAME_ENABLED = true

      // ---------- Cursor-reactive flow field (fixed, full-page background) ----------
      const canvas = document.getElementById('flowField')
      const ctx2 = canvas.getContext('2d')
      let W, H

      function hexToRgba(hex, alpha) {
        const n = parseInt(hex.replace('#', ''), 16)
        const r = (n >> 16) & 255,
          g = (n >> 8) & 255,
          b = n & 255
        return `rgba(${r}, ${g}, ${b}, ${alpha})`
      }

      const PALETTES = {
        dark: {
          trail: 'rgba(13,15,16,0.18)',
          bg: '#0D0F10',
          dots: ['#3E8EDE', '#4CC38A', '#FF5A1F'],
          signal: '#FF5A1F',
          label: '#EDEFEF',
        },
        light: {
          trail: 'rgba(243,242,238,0.22)',
          bg: '#F3F2EE',
          dots: ['#1F6FB2', '#1F8F5F', '#D9480F'],
          signal: '#D9480F',
          label: '#14171A',
        },
      }
      let palette = PALETTES[PAGE_MODE]
      if (PAGE_BG_COLOR) {
        const trailAlpha = PAGE_MODE === 'light' ? 0.22 : 0.18
        palette = {
          ...palette,
          bg: PAGE_BG_COLOR,
          trail: hexToRgba(PAGE_BG_COLOR, trailAlpha),
        }
      }

      // ---------- Mini-game state (must exist before resize()/placeTarget() run) ----------
      let score = 0
      const target = { x: 0, y: 0, r: 26 }
      function placeTarget() {
        target.x = W - 90
        target.y = 96 // top-right, under the "Contact" nav link
      }
      let targetFlash = 0
      function bumpScore() {
        score++
        targetFlash = 1
      }
      const bursts = []
      function spawnBurst(x, y, color) {
        bursts.push({ x, y, r: target.r * 0.4, alpha: 0.5, color })
      }

      // ---------- Click the circle: throw stored score back out as real particles ----------
      function throwFromTarget() {
        const n = Math.min(10, score)
        if (n <= 0) return
        score -= n
        targetFlash = 1
        for (let i = 0; i < n; i++) {
          const p = particles[Math.floor(Math.random() * particles.length)]
          const angle = Math.random() * Math.PI * 2
          const speed = 2 + Math.random() * 3
          p.x = target.x + Math.cos(angle) * (target.r + 4)
          p.y = target.y + Math.sin(angle) * (target.r + 4)
          p.vx = Math.cos(angle) * speed
          p.vy = Math.sin(angle) * speed
        }
      }
      function respawnParticle(p) {
        // re-enter from a random edge, away from the target
        const edge = Math.floor(Math.random() * 4)
        if (edge === 0) {
          p.x = 0
          p.y = Math.random() * H
        } else if (edge === 1) {
          p.x = W
          p.y = Math.random() * H
        } else if (edge === 2) {
          p.x = Math.random() * W
          p.y = 0
        } else {
          p.x = Math.random() * W
          p.y = H
        }
        p.vx = 0
        p.vy = 0
      }

      function resize() {
        W = canvas.width = window.innerWidth
        H = canvas.height = window.innerHeight
        placeTarget()
      }
      resize()
      window.addEventListener('resize', resize)

      const mouse = { x: -9999, y: -9999 }
      window.addEventListener('pointermove', (e) => {
        mouse.x = e.clientX
        mouse.y = e.clientY
      })
      window.addEventListener('pointerleave', () => {
        mouse.x = -9999
        mouse.y = -9999
      })

      const targetHitBtn = document.getElementById('targetHit')
      if (MINIGAME_ENABLED) {
        targetHitBtn.addEventListener('click', throwFromTarget)
      } else {
        targetHitBtn.style.display = 'none'
      }

      const N = 130
      const particles = Array.from({ length: N }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: 0,
        vy: 0,
        c: palette.dots[Math.floor(Math.random() * palette.dots.length)],
      }))

      function noise(x, y, t) {
        return Math.sin(x * 0.0025 + t) + Math.cos(y * 0.003 - t * 0.8)
      }

      const reduced = window.matchMedia(
        '(prefers-reduced-motion: reduce)',
      ).matches
      let t = 0
      function drawField() {
        ctx2.fillStyle = palette.trail
        ctx2.fillRect(0, 0, W, H)
        t += 0.003

        for (const p of particles) {
          const angle = noise(p.x, p.y, t) * Math.PI
          p.vx += Math.cos(angle) * 0.06
          p.vy += Math.sin(angle) * 0.06

          const dx = p.x - mouse.x,
            dy = p.y - mouse.y
          const dist = Math.hypot(dx, dy)
          if (dist < 140) {
            const force = (1 - dist / 140) * 1.4
            p.vx += (dx / dist) * force
            p.vy += (dy / dist) * force
          }

          p.vx *= 0.9
          p.vy *= 0.9
          p.x += p.vx
          p.y += p.vy

          if (p.x < 0) p.x = W
          if (p.x > W) p.x = 0
          if (p.y < 0) p.y = H
          if (p.y > H) p.y = 0

          ctx2.fillStyle = p.c
          ctx2.globalAlpha = 0.75
          ctx2.beginPath()
          ctx2.arc(p.x, p.y, 1.6, 0, Math.PI * 2)
          ctx2.fill()

          if (MINIGAME_ENABLED) {
            const tdx = p.x - target.x,
              tdy = p.y - target.y
            if (Math.hypot(tdx, tdy) < target.r) {
              bumpScore()
              spawnBurst(target.x, target.y, p.c)
              respawnParticle(p)
            }
          }
        }
        ctx2.globalAlpha = 1

        if (MINIGAME_ENABLED) {
          // score-burst rings
          for (let i = bursts.length - 1; i >= 0; i--) {
            const b = bursts[i]
            b.r += 1.3
            b.alpha -= 0.025
            if (b.alpha <= 0) {
              bursts.splice(i, 1)
              continue
            }
            ctx2.strokeStyle = b.color
            ctx2.lineWidth = 1
            ctx2.globalAlpha = b.alpha
            ctx2.beginPath()
            ctx2.arc(b.x, b.y, b.r, 0, Math.PI * 2)
            ctx2.stroke()
          }
          ctx2.globalAlpha = 1

          // score number, centered in the circle
          const fontSize = 14 + targetFlash * 2
          ctx2.fillStyle = palette.signal
          ctx2.font = `400 ${fontSize}px 'Share Tech Mono', 'JetBrains Mono', monospace`
          ctx2.textAlign = 'center'
          ctx2.textBaseline = 'middle'
          ctx2.globalAlpha = 0.55
          ctx2.fillText(String(score), target.x, target.y + 1)
          ctx2.globalAlpha = 1

          targetFlash *= 0.88
        }

        if (!reduced) requestAnimationFrame(drawField)
      }
      ctx2.fillStyle = palette.bg
      ctx2.fillRect(0, 0, W, H)
      if (MINIGAME_ENABLED) drawField()

      // Project data — edit freely. Put your image files in an "images/" folder
      // next to this HTML file, then point "img" at each one.
      // "link" can be an internal page (e.g. 'projects/foliage.html') or a full
      // external URL (e.g. 'https://artstation.com/...') — either works.
      const projects = [
        {
          title: 'WireColor Pro',
          desc: 'WireColor Pro: Object wire color randomization, instance sync, gradients, and material control for 3ds Max.',
          date: 'DEC 2014',
          tools: ['MaxScript', '3ds Max', 'Free Download'],
          img: 'images/markhunanyan_procolor.jpg',
          link: 'https://github.com/markulie/3dsmax-wirecolor-pro',
        },
        {
          title: 'Light of Life',
          desc: 'Still Life 3D Artwork.',
          date: 'MAR 2014',
          tools: ['3ds Max', 'V-Ray'],
          img: 'images/mark_hunanyan_light_of_life.jpg',
          link: 'light-of-life.html',
        },
        {
          title: 'Codename Playa',
          desc: 'Open World Sandbox game made with Unreal Engine.',
          date: 'JUL 2024',
          tools: ['C++', 'Unreal'],
          img: 'playa/environment-1024x576.jpg',
          link: 'playa.html',
        },
        {
          title: 'Unity Smooth Follow',
          desc: 'Smooth Follow with Lerp for Unity.',
          date: 'OCT 2022',
          tools: ['C#', 'Unity', 'Free Download'],
          img: 'images/markulie-smooth-follow.jpg',
          link: 'https://github.com/markulie/unity-smooth-follow',
        },
        {
          title: 'RandomX',
          desc: 'Transform Randomizer for 3ds Max.',
          date: 'MAY 2015',
          tools: ['MaxScript', '3ds Max', 'Free Download'],
          img: 'images/markhunanyan_randomx.jpg',
          link: 'https://github.com/markulie/3dsmax-randomx',
        },
        {
          title: 'AnimLayerCleaner',
          desc: 'Bugged Animation Layer Cleaner for 3ds Max.',
          date: 'SEP 2022',
          tools: ['MaxScript', '3ds Max', 'Free Download'],
          img: 'images/markulie-animlayercleaner.jpg',
          link: 'https://github.com/markulie/3dsmax-anim-layer-cleaner',
        },
        {
          title: 'Hand Rig',
          desc: 'Hand Rig Demonstartion in Autodesk 3ds Max.',
          date: 'APR 2015',
          tools: ['3ds Max', 'Rigging', 'Free Download'],
          img: 'images/mark_hunanyan_handrig_01.jpg',
          link: 'https://github.com/markulie/3dsmax-hand-rig',
        },
        {
          title: '"Tishka Trains"',
          desc: '3D Cartoon TV Series.',
          date: 'APR 2014',
          tools: ['Maya', '3ds Max', 'mentalRay','After Effects'],
          img: 'images/markhunanyan_trains.jpg',
          link: 'trains.html',
        },
        {
          title: 'VrayBlendMtl',
          desc: 'A V-Ray Blend Material example for Autodesk 3ds Max.',
          date: 'MAY 2013',
          tools: ['3ds Max', 'V-Ray', 'Shading', 'Free Download'],
          img: 'images/markhunanyan_vrayblendmtl.jpg',
          link: 'https://github.com/markulie/3dsmax-vrayblendmtl',
        },
        {
          title: 'LUNETA',
          desc: '...',
          date: 'APR 2017',
          tools: ['C#', 'Unity'],
          img: 'images/markulie_luneta.png',
          link: 'luneta.html',
        },
        {

      const grid = document.getElementById('cardGrid')

      projects.forEach((p) => {
        const card = document.createElement('a')
        card.className = 'card'
        card.href = p.link
        if (/^https?:\/\//.test(p.link)) {
          card.target = '_blank'
          card.rel = 'noopener'
        }
        card.innerHTML = `
      <div class="card-art">
        <span class="card-date">${p.date}</span>
        <img src="${p.img}" alt="${p.title}" loading="lazy">
      </div>
      <div class="card-body">
        <div class="card-title">${p.title}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-tools">${p.tools.map((t) => `<span>${t}</span>`).join('')}</div>
      </div>`
        grid.appendChild(card)
      })

      const menuToggle = document.getElementById('menuToggle')
      const mobileNav = document.getElementById('mobileNav')
      menuToggle.addEventListener('click', () => {
        mobileNav.classList.toggle('open')
        menuToggle.textContent = mobileNav.classList.contains('open')
          ? '✕'
          : '☰'
      })
      mobileNav.querySelectorAll('a').forEach((a) =>
        a.addEventListener('click', () => {
          mobileNav.classList.remove('open')
          menuToggle.textContent = '☰'
        }),
      )
    </script>
